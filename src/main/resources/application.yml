debug: false
server:
  port: 9081
spring:
  devtools:
    restart:
      enabled: false
      additional-exclude: "**/target/**,**/generated/**,**/build/**"
      trigger-file: .restart
  ai:
    model:
      # Leave chat unset so both the SpaceXAI client and the Ollama client start.
      # A single value such as openai switches every other chat model off.
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    chat:
      client:
        # Two ChatModel beans are present. The shared ChatClient builder accepts only one.
        enabled: false
    ollama:
      # Local Ollama. Point this at the service you are updating.
      base-url: http://malboji:11434
      init:
        pull-model-strategy: never
      chat:
        model: gpt-oss:20b
    openai:
      # SpaceXAI OpenAI-compatible API. Spring AI 2.0 includes /v1 in the base URL.
      # "_" means XAI_API_KEY is unset. The judge refuses to call until a real key is present.
      api-key: ${XAI_API_KEY:_}
      base-url: https://api.x.ai/v1
      timeout: 120s
      max-retries: 1
      chat:
        model: grok-4.7
  mongodb:
    uri: mongodb://dragon:27017/NLP
ontology:
  km-server: http://malboji:8080/km
  cyc-server: http://dragon:3602